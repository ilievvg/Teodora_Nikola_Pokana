<!DOCTYPE html>
<html lang="mk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#294f40">
  <meta name="description" content="Потврдете го присуството на свадбата на Теодора и Никола, 11 октомври 2026.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="mk_MK">
  <meta property="og:title" content="Потврда на присуство | Теодора и Никола">
  <meta property="og:description" content="Јавете ни се дали ќе ни се придружите на 11 октомври 2026.">
  <title>Потврда на присуство | Теодора и Никола</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23294f40'/%3E%3Ccircle%20cx='16'%20cy='16'%20r='10.5'%20fill='none'%20stroke='%23f3ede1'%20stroke-width='1.25'/%3E%3Cpath%20d='M16%2010.5%20l4%205.5%20-4%205.5%20-4%20-5.5%20z'%20fill='%23f3ede1'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body data-previous="ceremony.html" data-next="thank-you.html">
  <main class="page page--linen">
    <div class="page-grain" aria-hidden="true"></div>

    <div class="page-content">
      <p class="eyebrow reveal">Ве молиме потврдете</p>
      <h1 class="section-title section-title--compact reveal reveal-delay-1">Потврда на присуство</h1>

      <!-- TODO: формата засега го чува одговорот само во прелистувачот на гостинот.
           За да стигнат одговорите до вас, поврзете ја со сервис
           (на пр. Formspree, Google Forms или сопствен endpoint):
           <form action="https://formspree.io/f/XXXX" method="POST"> -->
      <form class="rsvp-form reveal reveal-delay-2" data-rsvp-form novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Име и презиме</label>
          <input
            class="form-input"
            id="name"
            name="name"
            type="text"
            placeholder="Име и презиме"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="attendance">Дали ќе присуствувате?</label>
          <select class="form-select" id="attendance" name="attendance" required>
            <option value="">Изберете одговор</option>
            <option value="yes">Со задоволство ќе присуствувам</option>
            <option value="no">За жал, нема да можам</option>
          </select>
        </div>

        <div class="form-group" data-guests-group>
          <label class="form-label" for="guests">Број на гости</label>
          <select class="form-select" id="guests" name="guests" aria-describedby="guests-hint">
            <option value="1">1 гостин</option>
            <option value="2">2 гости</option>
            <option value="3">3 гости</option>
            <option value="4">4 гости</option>
            <option value="5">5 гости</option>
             <option value="5">6 гости</option>
          </select>
          <p class="form-hint" id="guests-hint">Вклучувајќи Ве и Вас.</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="message">Порака за нас</label>
          <textarea
            class="form-textarea"
            id="message"
            name="message"
            placeholder="Оставете ни порака…"
          ></textarea>
        </div>

        <button class="button button--filled" type="submit">Испратете ја потврдата</button>

        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
      </form>
    </div>

    <nav class="page-nav" aria-label="Навигација низ поканата">
      <a class="page-nav-button" href="ceremony.html" data-go-previous aria-label="Претходна страница: Венчавка">↑</a>
      <div class="page-progress" data-page-progress="4"></div>
      <a class="page-nav-button" href="thank-you.html" data-go-next aria-label="Следна страница: Ви благодариме">↓</a>
    </nav>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
